<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="880" viewBox="0 0 1120 880"><title>Битовые поля</title><rect width="1120" height="880" fill="#1f1e24"/><g fill="#ececef" font-family="Arial, sans-serif" font-size="20"><text x="40" y="42">Битовые поля</text><text x="40" y="91">Флаги этапов: каждый прямоугольник — один бит. Старший бит слева.</text><rect x="40" y="128" width="120" height="50" fill="none" stroke="#b3afb9"/><text x="80" y="160">0</text><text x="90" y="118">7</text><rect x="160" y="128" width="120" height="50" fill="none" stroke="#b3afb9"/><text x="200" y="160">0</text><text x="210" y="118">6</text><rect x="280" y="128" width="120" height="50" fill="none" stroke="#b3afb9"/><text x="320" y="160">0</text><text x="330" y="118">5</text><rect x="400" y="128" width="120" height="50" fill="none" stroke="#b3afb9"/><text x="440" y="160">0</text><text x="450" y="118">4</text><rect x="520" y="128" width="120" height="50" fill="none" stroke="#b3afb9"/><text x="560" y="160">0</text><text x="570" y="118">3</text><rect x="640" y="128" width="120" height="50" fill="none" stroke="#b3afb9"/><text x="680" y="160">RS</text><text x="690" y="118">2</text><rect x="760" y="128" width="120" height="50" fill="none" stroke="#b3afb9"/><text x="800" y="160">rANS</text><text x="810" y="118">1</text><rect x="880" y="128" width="120" height="50" fill="none" stroke="#b3afb9"/><text x="920" y="160">LZ77</text><text x="930" y="118">0</text><text x="40" y="214">Биты 0–2: 1 — этап включён, 0 — выключен. Биты 3–7 всегда равны нулю.</text><text x="40" y="265">Байт переменного целого: 1 бит продолжения и 7 бит числа.</text><rect x="40" y="294" width="120" height="50" fill="none" stroke="#b3afb9"/><text x="84" y="327">C</text><rect x="160" y="294" width="120" height="50" fill="none" stroke="#b3afb9"/><text x="204" y="327">b6</text><rect x="280" y="294" width="120" height="50" fill="none" stroke="#b3afb9"/><text x="324" y="327">b5</text><rect x="400" y="294" width="120" height="50" fill="none" stroke="#b3afb9"/><text x="444" y="327">b4</text><rect x="520" y="294" width="120" height="50" fill="none" stroke="#b3afb9"/><text x="564" y="327">b3</text><rect x="640" y="294" width="120" height="50" fill="none" stroke="#b3afb9"/><text x="684" y="327">b2</text><rect x="760" y="294" width="120" height="50" fill="none" stroke="#b3afb9"/><text x="804" y="327">b1</text><rect x="880" y="294" width="120" height="50" fill="none" stroke="#b3afb9"/><text x="924" y="327">b0</text><text x="40" y="380">C = 1, если следующий байт есть; C = 0 для последнего байта.</text><text x="40" y="416">Байт i = (floor(V / 2^(7i)) mod 128) + 128 × C.</text><text x="40" y="452">Пример 128: 10000000  00000001. Группы числа идут от младшей к старшей.</text><text x="40" y="507">Число символов rANS: все 8 бит занимают значение D − 1.</text><rect x="40" y="535" width="120" height="50" fill="none" stroke="#b3afb9"/><text x="82" y="568">b7</text><rect x="160" y="535" width="120" height="50" fill="none" stroke="#b3afb9"/><text x="202" y="568">b6</text><rect x="280" y="535" width="120" height="50" fill="none" stroke="#b3afb9"/><text x="322" y="568">b5</text><rect x="400" y="535" width="120" height="50" fill="none" stroke="#b3afb9"/><text x="442" y="568">b4</text><rect x="520" y="535" width="120" height="50" fill="none" stroke="#b3afb9"/><text x="562" y="568">b3</text><rect x="640" y="535" width="120" height="50" fill="none" stroke="#b3afb9"/><text x="682" y="568">b2</text><rect x="760" y="535" width="120" height="50" fill="none" stroke="#b3afb9"/><text x="802" y="568">b1</text><rect x="880" y="535" width="120" height="50" fill="none" stroke="#b3afb9"/><text x="922" y="568">b0</text><text x="40" y="620">Записано D − 1; при чтении D = значение + 1. Диапазон D: 1…256.</text><text x="40" y="676">Байт j битовой карты rANS: один бит на один символ.</text><rect x="40" y="705" width="120" height="50" fill="none" stroke="#b3afb9"/><text x="70" y="738">8j+7</text><rect x="160" y="705" width="120" height="50" fill="none" stroke="#b3afb9"/><text x="190" y="738">8j+6</text><rect x="280" y="705" width="120" height="50" fill="none" stroke="#b3afb9"/><text x="310" y="738">8j+5</text><rect x="400" y="705" width="120" height="50" fill="none" stroke="#b3afb9"/><text x="430" y="738">8j+4</text><rect x="520" y="705" width="120" height="50" fill="none" stroke="#b3afb9"/><text x="550" y="738">8j+3</text><rect x="640" y="705" width="120" height="50" fill="none" stroke="#b3afb9"/><text x="670" y="738">8j+2</text><rect x="760" y="705" width="120" height="50" fill="none" stroke="#b3afb9"/><text x="790" y="738">8j+1</text><rect x="880" y="705" width="120" height="50" fill="none" stroke="#b3afb9"/><text x="910" y="738">8j+0</text><text x="40" y="793">Для символа s: j = floor(s / 8), номер бита = s mod 8.</text><text x="40" y="830">1 — символ присутствует. Всего 32 таких байта, то есть 256 равных битовых ячеек.</text></g></svg>