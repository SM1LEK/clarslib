<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1170" viewBox="0 0 1280 1170"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#b3afb9"/></marker></defs><rect width="100%" height="100%" fill="#1f1e24"/><text x="305.0" y="55.1" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" fill="#ececef" font-weight="bold"><tspan x="305.0" dy="0">Кодирование</tspan></text><rect x="80" y="100" width="460" height="160" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/><text x="310.0" y="159.1" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#ececef"><tspan x="310.0" dy="0">Разделить вход на слова</tspan><tspan x="310.0" dy="28.6">До 223 байт данных в каждом слове.</tspan><tspan x="310.0" dy="28.6">Последнее слово может быть короче.</tspan></text><rect x="80" y="310" width="460" height="160" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/><text x="310.0" y="369.09999999999997" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#ececef"><tspan x="310.0" dy="0">Вычислить проверочную часть</tspan><tspan x="310.0" dy="28.6">Операции в GF(256).</tspan><tspan x="310.0" dy="28.6">32 байта чётности для каждого слова.</tspan></text><rect x="80" y="520" width="460" height="160" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/><text x="310.0" y="564.8000000000001" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#ececef"><tspan x="310.0" dy="0">Записать кодовое слово</tspan><tspan x="310.0" dy="28.6">Сначала данные, затем проверочные</tspan><tspan x="310.0" dy="28.6">байты.</tspan><tspan x="310.0" dy="28.6">Длина полного слова: 223 + 32 = 255.</tspan></text><rect x="80" y="730" width="460" height="160" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/><text x="310.0" y="789.1" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#ececef"><tspan x="310.0" dy="0">Записать остальные слова</tspan><tspan x="310.0" dy="28.6">Последнее слово: k + 32 байта.</tspan><tspan x="310.0" dy="28.6">Заполнение до 223 байт не добавляется.</tspan></text><rect x="80" y="940" width="460" height="160" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/><text x="310.0" y="999.1" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#ececef"><tspan x="310.0" dy="0">Разместить защиту в блоке</tspan><tspan x="310.0" dy="28.6">Заголовок: отдельное слово 12 + 32.</tspan><tspan x="310.0" dy="28.6">Сохранённые данные: отдельные слова.</tspan></text><text x="965.0" y="55.1" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" fill="#ececef" font-weight="bold"><tspan x="965.0" dy="0">Декодирование</tspan></text><rect x="740" y="100" width="460" height="160" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/><text x="970.0" y="144.79999999999998" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#ececef"><tspan x="970.0" dy="0">Прочитать кодовые слова</tspan><tspan x="970.0" dy="28.6">Исходная длина задаёт ожидаемый</tspan><tspan x="970.0" dy="28.6">размер.</tspan><tspan x="970.0" dy="28.6">Полные слова по 255 байт; хвост короче.</tspan></text><rect x="740" y="310" width="460" height="160" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/><text x="970.0" y="354.8" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#ececef"><tspan x="970.0" dy="0">Проверить и исправить слово</tspan><tspan x="970.0" dy="28.6">Декодер reed-solomon восстанавливает</tspan><tspan x="970.0" dy="28.6">до 16 неизвестных замен байтов.</tspan><tspan x="970.0" dy="28.6">Замены могут затронуть и чётность.</tspan></text><rect x="740" y="520" width="460" height="160" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/><text x="970.0" y="579.1" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#ececef"><tspan x="970.0" dy="0">Получить данные слова</tspan><tspan x="970.0" dy="28.6">Отбросить 32 проверочных байта.</tspan><tspan x="970.0" dy="28.6">Собрать данные восстановленных слов.</tspan></text><rect x="740" y="730" width="460" height="160" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/><text x="970.0" y="789.1" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#ececef"><tspan x="970.0" dy="0">Восстановить исходный блок</tspan><tspan x="970.0" dy="28.6">Для сжатого блока: rANS, затем LZ77.</tspan><tspan x="970.0" dy="28.6">Декодировать включённые этапы.</tspan></text><rect x="740" y="940" width="460" height="160" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/><text x="970.0" y="984.8000000000001" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#ececef"><tspan x="970.0" dy="0">Проверить результат</tspan><tspan x="970.0" dy="28.6">Длина и CRC32 исходного блока.</tspan><tspan x="970.0" dy="28.6">Для заголовка блока - собственная</tspan><tspan x="970.0" dy="28.6">CRC32.</tspan></text><path d="M310.0,260 L310.0,310" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M310.0,470 L310.0,520" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M310.0,680 L310.0,730" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M310.0,890 L310.0,940" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M970.0,260 L970.0,310" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M970.0,470 L970.0,520" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M970.0,680 L970.0,730" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M970.0,890 L970.0,940" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/></svg>