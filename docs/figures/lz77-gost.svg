<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="1880" viewBox="0 0 1420 1880"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#b3afb9"/></marker></defs><rect width="100%" height="100%" fill="#1f1e24"/><text x="300.0" y="55.1" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" fill="#ececef" font-weight="bold"><tspan x="300.0" dy="0">Кодирование</tspan></text><text x="960.0" y="55.1" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" fill="#ececef" font-weight="bold"><tspan x="960.0" dy="0">Декодирование</tspan></text><rect x="190" y="100" width="240" height="50" rx="24" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/><text x="310.0" y="132.7" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#ececef"><tspan x="310.0" dy="0">Начало</tspan></text><polygon points="104,195 540,195 516,270 80,270" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/><text x="310.0" y="225.89999999999998" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#ececef"><tspan x="310.0" dy="0">Вход: N байт</tspan><tspan x="310.0" dy="28.6">0 &lt;= N &lt;= 65536</tspan></text><rect x="80" y="320" width="460" height="90" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/><text x="310.0" y="358.4" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#ececef"><tspan x="310.0" dy="0">Записать N (varint); p = 0</tspan><tspan x="310.0" dy="28.6">Создать пустые таблицы поиска</tspan></text><polygon points="310.0,470 540,522.5 310.0,575 80,522.5" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/><text x="310.0" y="515.9" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#ececef"><tspan x="310.0" dy="0">Остались байты?</tspan><tspan x="310.0" dy="28.6">p &lt; N</tspan></text><rect x="80" y="635" width="460" height="65" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/><text x="310.0" y="675.2" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#ececef"><tspan x="310.0" dy="0">limit = min(255, N − p − 1)</tspan></text><rect x="80" y="755" width="460" height="115" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/><text x="310.0" y="791.6" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#ececef"><tspan x="310.0" dy="0">Найти самое длинное совпадение</tspan><tspan x="310.0" dy="28.6">в окне до 4096 байт</tspan><tspan x="310.0" dy="28.6">Получить l и d; нет совпадения: l = 0</tspan></text><polygon points="310.0,930 540,982.5 310.0,1035 80,982.5" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/><text x="310.0" y="975.9000000000001" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#ececef"><tspan x="310.0" dy="0">Есть совпадение?</tspan><tspan x="310.0" dy="28.6">l &gt; 0</tspan></text><rect x="35" y="1095" width="255" height="95" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/><text x="162.5" y="1136.8000000000002" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#ececef"><tspan x="162.5" dy="0">Записать длину 0</tspan><tspan x="162.5" dy="24.7">Расстояние не писать</tspan></text><rect x="330" y="1095" width="255" height="95" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/><text x="457.5" y="1136.8000000000002" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#ececef"><tspan x="457.5" dy="0">Записать l и d</tspan><tspan x="457.5" dy="24.7">Длина - байт; d - varint</tspan></text><rect x="80" y="1250" width="460" height="85" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/><text x="310.0" y="1285.9" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#ececef"><tspan x="310.0" dy="0">Записать явный байт</tspan><tspan x="310.0" dy="28.6">c = вход[p + l]</tspan></text><rect x="80" y="1390" width="460" height="110" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/><text x="310.0" y="1424.1000000000001" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#ececef"><tspan x="310.0" dy="0">next = p + l + 1</tspan><tspan x="310.0" dy="28.6">Внести позиции p..=next − 1</tspan><tspan x="310.0" dy="28.6">в таблицы поиска; p = next</tspan></text><polygon points="104,1660 540,1660 516,1730 80,1730" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/><text x="310.0" y="1702.7" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#ececef"><tspan x="310.0" dy="0">Выход: N и тройки</tspan></text><rect x="190" y="1780" width="240" height="50" rx="24" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/><text x="310.0" y="1812.7" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#ececef"><tspan x="310.0" dy="0">Конец</tspan></text><rect x="850" y="100" width="240" height="50" rx="24" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/><text x="970.0" y="132.7" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#ececef"><tspan x="970.0" dy="0">Начало</tspan></text><polygon points="764,195 1200,195 1176,270 740,270" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/><text x="970.0" y="240.2" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#ececef"><tspan x="970.0" dy="0">Вход: LZ77-поток</tspan></text><rect x="740" y="320" width="460" height="115" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/><text x="970.0" y="356.59999999999997" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#ececef"><tspan x="970.0" dy="0">Проверить размер потока</tspan><tspan x="970.0" dy="28.6">Прочитать N: 0 &lt;= N &lt;= 65536</tspan><tspan x="970.0" dy="28.6">R = пустой список</tspan></text><polygon points="970.0,495 1200,547.5 970.0,600 740,547.5" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/><text x="970.0" y="541.2" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#ececef"><tspan x="970.0" dy="0">Есть ещё тройка?</tspan><tspan x="970.0" dy="27.3">Остались байты входа</tspan></text><rect x="740" y="660" width="460" height="90" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/><text x="970.0" y="698.4000000000001" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#ececef"><tspan x="970.0" dy="0">Прочитать l; если l &gt; 0, прочитать d</tspan><tspan x="970.0" dy="28.6">Иначе d = 0; прочитать c</tspan></text><polygon points="970.0,810 1200,880.0 970.0,950 740,880.0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/><text x="970.0" y="861.9499999999999" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#ececef"><tspan x="970.0" dy="0">Тройка допустима?</tspan><tspan x="970.0" dy="24.7">l &gt; 0: 1 &lt;= d &lt;= min(4096, len(R))</tspan><tspan x="970.0" dy="24.7">len(R) + l + 1 &lt;= N</tspan></text><rect x="740" y="1005" width="460" height="55" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/><text x="970.0" y="1040.2" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#ececef"><tspan x="970.0" dy="0">j = 0</tspan></text><polygon points="970.0,1120 1200,1172.5 970.0,1225 740,1172.5" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/><text x="970.0" y="1166.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#ececef"><tspan x="970.0" dy="0">Нужно ещё копировать?</tspan><tspan x="970.0" dy="26.0">j &lt; l</tspan></text><rect x="740" y="1290" width="460" height="85" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/><text x="970.0" y="1325.9" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#ececef"><tspan x="970.0" dy="0">Добавить в R байт R[len(R) − d]</tspan><tspan x="970.0" dy="28.6">j = j + 1</tspan></text><rect x="740" y="1435" width="460" height="70" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/><text x="970.0" y="1477.7" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#ececef"><tspan x="970.0" dy="0">Добавить в R явный байт c</tspan></text><polygon points="970.0,1560 1200,1612.5 970.0,1665 740,1612.5" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/><text x="970.0" y="1606.8000000000002" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#ececef"><tspan x="970.0" dy="0">Длина результата верна?</tspan><tspan x="970.0" dy="24.7">len(R) = N</tspan></text><polygon points="764,1710 1200,1710 1176,1780 740,1780" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/><text x="970.0" y="1752.7" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#ececef"><tspan x="970.0" dy="0">Выход: исходные N байт</tspan></text><rect x="850" y="1820" width="240" height="50" rx="24" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/><text x="970.0" y="1852.7" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#ececef"><tspan x="970.0" dy="0">Конец</tspan></text><rect x="1280" y="900" width="100" height="80" rx="24" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/><text x="1330.0" y="945.6" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#ececef"><tspan x="1330.0" dy="0">Ошибка</tspan></text><rect x="1280" y="1575" width="100" height="80" rx="24" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/><text x="1330.0" y="1620.6" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#ececef"><tspan x="1330.0" dy="0">Ошибка</tspan></text><path d="M310.0,150 L310.0,195" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M310.0,270 L310.0,320" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M310.0,410 L310.0,470" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M310.0,575 L310.0,635" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M310.0,700 L310.0,755" fill="none" stroke="#b3afb9" stroke-widt