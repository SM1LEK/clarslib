<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="670" viewBox="0 0 1120 670"><title>Архив: расположение полей</title><rect width="1120" height="670" fill="#1f1e24"/><g fill="#ececef" font-family="Arial, sans-serif" font-size="20"><text x="40" y="42">Архив: расположение полей</text><text x="40" y="86">Заголовок архива — 13 байт. Ширина поля соответствует его размеру.</text><rect x="40" y="125" width="576" height="55" fill="none" stroke="#b3afb9"/><text x="52" y="160">CLARSLIB</text><text x="40" y="113">0</text><rect x="616" y="125" width="72" height="55" fill="none" stroke="#b3afb9"/><text x="628" y="160">Ф</text><text x="616" y="113">8</text><rect x="688" y="125" width="288" height="55" fill="none" stroke="#b3afb9"/><text x="700" y="160">CRC32</text><text x="688" y="113">9</text><text x="40" y="213">Ф — флаги этапов, 1 байт. CRC32 — сумма первых 9 байт.</text><text x="40" y="267">Заголовок блока — 12 байт. Смещения относительно его начала.</text><rect x="40" y="307" width="156" height="55" fill="none" stroke="#b3afb9"/><text x="54" y="342">N − 1</text><text x="40" y="295">0</text><rect x="196" y="307" width="156" height="55" fill="none" stroke="#b3afb9"/><text x="210" y="342">S − 1</text><text x="196" y="295">2</text><rect x="352" y="307" width="312" height="55" fill="none" stroke="#b3afb9"/><text x="366" y="342">CRC данных</text><text x="352" y="295">4</text><rect x="664" y="307" width="312" height="55" fill="none" stroke="#b3afb9"/><text x="678" y="342">CRC заголовка</text><text x="664" y="295">8</text><text x="40" y="398">В первых двух полях: записано N − 1 и S − 1, по 16 бит, младший байт первым.</text><text x="40" y="432">N — исходный размер; S — сохранённый размер. 1 ≤ S ≤ N ≤ 65536.</text><text x="40" y="486">Архив целиком (длины блоков здесь условные):</text><rect x="40" y="510" width="220" height="52" fill="none" stroke="#b3afb9"/><text x="60" y="544">Заголовок</text><rect x="260" y="510" width="250" height="52" fill="none" stroke="#b3afb9"/><text x="280" y="544">Блок 0</text><rect x="510" y="510" width="250" height="52" fill="none" stroke="#b3afb9"/><text x="530" y="544">Блок 1</text><rect x="760" y="510" width="250" height="52" fill="none" stroke="#b3afb9"/><text x="780" y="544">… последний</text><text x="40" y="602">Без RS: блок = заголовок 12 байт + S байт данных.</text><text x="40" y="638">С RS: блок = заголовок 12 + 32 байта + данные по словам до 223 + 32 байт.</text></g></svg>