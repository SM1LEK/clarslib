<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="1980" viewBox="0 0 1420 1980"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#b3afb9"/></marker></defs><rect width="100%" height="100%" fill="#1f1e24"/><text x="300.0" y="55.1" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" fill="#ececef" font-weight="bold"><tspan x="300.0" dy="0">Кодирование</tspan></text><text x="960.0" y="55.1" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" fill="#ececef" font-weight="bold"><tspan x="960.0" dy="0">Декодирование</tspan></text><rect x="190" y="100" width="240" height="50" rx="24" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/><text x="310.0" y="132.7" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#ececef"><tspan x="310.0" dy="0">Начало</tspan></text><polygon points="104,200 540,200 516,275 80,275" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/><text x="310.0" y="245.2" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#ececef"><tspan x="310.0" dy="0">Вход: N байт; N &gt; 0</tspan></text><rect x="80" y="335" width="460" height="115" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/><text x="310.0" y="371.59999999999997" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#ececef"><tspan x="310.0" dy="0">Нормировать f: сумма = 4096</tspan><tspan x="310.0" dy="28.6">Построить начала интервалов c</tspan><tspan x="310.0" dy="28.6">x = L; i = N − 1; B = пустой список</tspan></text><polygon points="310.0,520 540,572.5 310.0,625 80,572.5" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/><text x="310.0" y="565.9000000000001" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#ececef"><tspan x="310.0" dy="0">Остались символы?</tspan><tspan x="310.0" dy="28.6">i &gt;= 0</tspan></text><rect x="80" y="695" width="460" height="85" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/><text x="310.0" y="730.9000000000001" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#ececef"><tspan x="310.0" dy="0">s = вход[i]</tspan><tspan x="310.0" dy="28.6">f = f(s); c = c(s)</tspan></text><polygon points="310.0,850 540,902.5 310.0,955 80,902.5" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/><text x="310.0" y="896.2" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#ececef"><tspan x="310.0" dy="0">Выгрузить байт из x?</tspan><tspan x="310.0" dy="27.3">x &gt;= 524288 × f</tspan></text><rect x="80" y="1025" width="460" height="85" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/><text x="310.0" y="1060.9" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#ececef"><tspan x="310.0" dy="0">Добавить в B байт x mod 256</tspan><tspan x="310.0" dy="28.6">x = floor(x / 256)</tspan></text><rect x="80" y="1180" width="460" height="90" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/><text x="310.0" y="1218.4" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#ececef"><tspan x="310.0" dy="0">x = floor(x / f) × 4096</tspan><tspan x="310.0" dy="28.6">+ (x mod f) + c</tspan></text><rect x="80" y="1340" width="460" height="55" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/><text x="310.0" y="1375.2" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#ececef"><tspan x="310.0" dy="0">i = i − 1</tspan></text><polygon points="104,1550 540,1550 516,1650 80,1650" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/><text x="310.0" y="1593.4" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#ececef"><tspan x="310.0" dy="0">Выход: N, модель, x (4 байта LE)</tspan><tspan x="310.0" dy="28.6">и байты B в обратном порядке</tspan></text><rect x="190" y="1740" width="240" height="50" rx="24" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/><text x="310.0" y="1772.7" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#ececef"><tspan x="310.0" dy="0">Конец</tspan></text><rect x="850" y="100" width="240" height="50" rx="24" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/><text x="970.0" y="132.7" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#ececef"><tspan x="970.0" dy="0">Начало</tspan></text><polygon points="764,200 1200,200 1176,275 740,275" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/><text x="970.0" y="245.2" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#ececef"><tspan x="970.0" dy="0">Вход: rANS-поток; N &gt; 0</tspan></text><rect x="740" y="335" width="460" height="85" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/><text x="970.0" y="370.9" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#ececef"><tspan x="970.0" dy="0">Прочитать N, модель и x</tspan><tspan x="970.0" dy="28.6">Проверить длины и частоты</tspan></text><polygon points="970.0,490 1200,542.5 970.0,595 740,542.5" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/><text x="970.0" y="536.2" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#ececef"><tspan x="970.0" dy="0">Заголовок допустим?</tspan><tspan x="970.0" dy="27.3">L &lt;= x &lt; 256L</tspan></text><rect x="740" y="655" width="460" height="85" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/><text x="970.0" y="690.9000000000001" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#ececef"><tspan x="970.0" dy="0">Построить таблицу символов</tspan><tspan x="970.0" dy="28.6">k = 0</tspan></text><polygon points="970.0,810 1200,862.5 970.0,915 740,862.5" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/><text x="970.0" y="855.9000000000001" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#ececef"><tspan x="970.0" dy="0">Выдано N байт?</tspan><tspan x="970.0" dy="28.6">k = N</tspan></text><rect x="740" y="980" width="460" height="130" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/><text x="970.0" y="1013.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#ececef"><tspan x="970.0" dy="0">q = x mod 4096</tspan><tspan x="970.0" dy="26.0">Найти s: c(s) &lt;= q &lt; c(s) + f(s)</tspan><tspan x="970.0" dy="26.0">Выдать s</tspan><tspan x="970.0" dy="26.0">x = f(s) × floor(x / 4096) + q − c(s)</tspan></text><polygon points="970.0,1180 1200,1232.5 970.0,1285 740,1232.5" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/><text x="970.0" y="1225.9" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#ececef"><tspan x="970.0" dy="0">Вернуть байт в x?</tspan><tspan x="970.0" dy="28.6">x &lt; L</tspan></text><polygon points="764,1340 1200,1340 1176,1425 740,1425" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/><text x="970.0" y="1375.9" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#ececef"><tspan x="970.0" dy="0">Прочитать следующий байт b</tspan><tspan x="970.0" dy="28.6">x = 256x + b</tspan></text><rect x="740" y="1480" width="460" height="55" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/><text x="970.0" y="1515.2" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#ececef"><tspan x="970.0" dy="0">k = k + 1</tspan></text><polygon points="970.0,1600 1200,1652.5 970.0,1705 740,1652.5" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/><text x="970.0" y="1646.1999999999998" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#ececef"><tspan x="970.0" dy="0">Все байты прочитаны</tspan><tspan x="970.0" dy="27.3">и x = L?</tspan></text><polygon points="764,1740 1200,1740 1176,1805 740,1805" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/><text x="970.0" y="1780.2" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#ececef"><tspan x="970.0" dy="0">Выход: исходные N байт</tspan></text><rect x="1280" y="500" width="100" height="80" rx="24" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/><text x="1330.0" y="545.6" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#ececef"><tspan x="1330.0" dy="0">Ошибка</tspan></text><rect x="1280" y="1615" width="100" height="80" rx="24" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/><text x="1330.0" y="1660.6" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#ececef"><tspan x="1330.0" dy="0">Ошибка</tspan></text><rect x="850" y="1870" width="240" height="50" rx="24" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/><text x="970.0" y="1902.7" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#ececef"><tspan x="970.0" dy="0">Конец</tspan></text><path d="M310.0,150 L310.0,200" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M310.0,275 L310.0,335" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M310.0,450 L310.0,520" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M310.0,625 L310.0,695" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M310.0,780 L310.0,850" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M310.0,955 L310.0,1025" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="326.0" y="953" width="46" height="27" fill="#1f1e24"/><text x="328.0" y="973" font-family="Arial,sans-serif" font-size="20" fill="#ececef">Да</text><path d="M310.0,1110 L310,1140 L35,1140 L35,902 L80,902" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M540,902 L585,902 L585,1148 L310,1148 L310.0,1180" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="556" y="900" width="46" height="27" fill="#1f1e24"/><text x="558" y="920" font-family="Arial,sans-serif" font-size="20" fill="#ececef">Нет</text><path d="M310.0,1270 L310