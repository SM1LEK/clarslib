<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="460" viewBox="0 0 1120 460"><title>LZ77: пример ABABABA</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8" fill="#b3afb9"/></marker></defs><rect width="1120" height="460" fill="#1f1e24"/><g fill="#ececef" font-family="Arial, sans-serif" font-size="20"><text x="40" y="42">LZ77: пример ABABABA</text><text x="40" y="91">Сначала записаны A и B. С позиции 2 можно скопировать четыре байта.</text><rect x="40" y="135" width="140" height="55" fill="none" stroke="#b3afb9"/><text x="100" y="172">A</text><text x="100" y="124">0</text><rect x="180" y="135" width="140" height="55" fill="none" stroke="#b3afb9"/><text x="240" y="172">B</text><text x="240" y="124">1</text><rect x="320" y="135" width="140" height="55" fill="none" stroke="#b3afb9"/><text x="380" y="172">A</text><text x="380" y="124">2</text><rect x="460" y="135" width="140" height="55" fill="none" stroke="#b3afb9"/><text x="520" y="172">B</text><text x="520" y="124">3</text><rect x="600" y="135" width="140" height="55" fill="none" stroke="#b3afb9"/><text x="660" y="172">A</text><text x="660" y="124">4</text><rect x="740" y="135" width="140" height="55" fill="none" stroke="#b3afb9"/><text x="800" y="172">B</text><text x="800" y="124">5</text><rect x="880" y="135" width="140" height="55" fill="none" stroke="#b3afb9"/><text x="940" y="172">A</text><text x="940" y="124">6</text><path d="M110 194 V220 H390 V194" fill="none" stroke="#b3afb9" marker-end="url(#arrow)"/><path d="M250 194 V245 H530 V194" fill="none" stroke="#b3afb9" marker-end="url(#arrow)"/><path d="M390 249 V278 H670 V194" fill="none" stroke="#b3afb9" marker-end="url(#arrow)"/><path d="M530 283 V310 H810 V194" fill="none" stroke="#b3afb9" marker-end="url(#arrow)"/><text x="40" y="354">Расстояние = 2, длина = 4. Новые байты становятся источником следующих.</text><text x="40" y="390">Порядок: AB → ABA → ABAB → ABABA → ABABAB; затем отдельный байт A.</text><text x="40" y="432">Тройки: (0, 0, A), (0, 0, B), (2, 4, A). Последняя A всегда записывается явно.</text></g></svg>