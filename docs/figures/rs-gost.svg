<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="1900" viewBox="0 0 1420 1900"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#b3afb9"/></marker></defs><rect width="100%" height="100%" fill="#1f1e24"/><text x="300.0" y="55.1" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" fill="#ececef" font-weight="bold"><tspan x="300.0" dy="0">Кодирование</tspan></text><text x="960.0" y="55.1" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" fill="#ececef" font-weight="bold"><tspan x="960.0" dy="0">Декодирование</tspan></text><rect x="190" y="100" width="240" height="50" rx="24" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/><text x="310.0" y="132.7" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#ececef"><tspan x="310.0" dy="0">Начало</tspan></text><polygon points="104,200 540,200 516,275 80,275" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/><text x="310.0" y="245.2" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#ececef"><tspan x="310.0" dy="0">Вход: S байт; 0 &lt;= S &lt;= 65536</tspan></text><rect x="80" y="335" width="460" height="85" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/><text x="310.0" y="370.9" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#ececef"><tspan x="310.0" dy="0">Создать Encoder(32)</tspan><tspan x="310.0" dy="28.6">p = 0; R = пусто</tspan></text><rect x="80" y="480" width="460" height="65" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/><text x="310.0" y="520.2" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#ececef"><tspan x="310.0" dy="0">E(S) = S + 32 × ceil(S / 223)</tspan></text><polygon points="310.0,615 540,667.5 310.0,720 80,667.5" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/><text x="310.0" y="660.9000000000001" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#ececef"><tspan x="310.0" dy="0">Остались данные?</tspan><tspan x="310.0" dy="28.6">p &lt; S</tspan></text><rect x="80" y="790" width="460" height="85" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/><text x="310.0" y="825.9000000000001" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#ececef"><tspan x="310.0" dy="0">k = min(223, S − p)</tspan><tspan x="310.0" dy="28.6">m = данные[p..=p + k - 1]</tspan></text><rect x="80" y="945" width="460" height="110" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/><path d="M92,945 V1055 M528,945 V1055" stroke="#b3afb9" fill="none"/><text x="310.0" y="979.1" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#ececef"><tspan x="310.0" dy="0">Вычислить 32 проверочных байта</tspan><tspan x="310.0" dy="28.6">r(z) = (m(z) × z^32) mod g(z)</tspan><tspan x="310.0" dy="28.6">Операции в GF(256)</tspan></text><rect x="80" y="1125" width="460" height="115" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/><text x="310.0" y="1161.6000000000001" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#ececef"><tspan x="310.0" dy="0">Собрать кодовое слово:</tspan><tspan x="310.0" dy="28.6">k исходных байтов</tspan><tspan x="310.0" dy="28.6">+ 32 проверочных байта</tspan></text><rect x="80" y="1310" width="460" height="85" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/><text x="310.0" y="1345.9" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#ececef"><tspan x="310.0" dy="0">Добавить слово в R</tspan><tspan x="310.0" dy="28.6">Последнее слово не дополнять нулями</tspan></text><rect x="80" y="1465" width="460" height="55" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/><text x="310.0" y="1500.2" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#ececef"><tspan x="310.0" dy="0">p = p + k</tspan></text><polygon points="104,1670 540,1670 516,1755 80,1755" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/><text x="310.0" y="1705.9" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#ececef"><tspan x="310.0" dy="0">Выход: защищённый поток R</tspan><tspan x="310.0" dy="28.6">Длина E(S)</tspan></text><rect x="190" y="1820" width="240" height="50" rx="24" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/><text x="310.0" y="1852.7" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#ececef"><tspan x="310.0" dy="0">Конец</tspan></text><rect x="850" y="100" width="240" height="50" rx="24" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/><text x="970.0" y="132.7" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#ececef"><tspan x="970.0" dy="0">Начало</tspan></text><polygon points="764,200 1200,200 1176,275 740,275" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/><text x="970.0" y="245.2" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#ececef"><tspan x="970.0" dy="0">Вход: защищённый поток и размер S</tspan></text><rect x="740" y="335" width="460" height="85" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/><text x="970.0" y="370.9" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#ececef"><tspan x="970.0" dy="0">Рассчитать E(S)</tspan><tspan x="970.0" dy="28.6">R = пусто; C = 0</tspan></text><polygon points="970.0,490 1200,545.0 970.0,600 740,545.0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/><text x="970.0" y="538.7" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#ececef"><tspan x="970.0" dy="0">Размеры допустимы?</tspan><tspan x="970.0" dy="27.3">S &lt;= 65536; длина = E(S)</tspan></text><polygon points="970.0,665 1200,717.5 970.0,770 740,717.5" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/><text x="970.0" y="725.2" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#ececef"><tspan x="970.0" dy="0">Осталось кодовое слово?</tspan></text><rect x="740" y="840" width="460" height="85" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/><text x="970.0" y="875.9000000000001" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#ececef"><tspan x="970.0" dy="0">Взять слово до 255 байт; n = 0</tspan><tspan x="970.0" dy="28.6">Вычислить 32 синдрома</tspan></text><polygon points="970.0,995 1200,1047.5 970.0,1100 740,1047.5" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/><text x="970.0" y="1055.2" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#ececef"><tspan x="970.0" dy="0">Все синдромы нулевые?</tspan></text><rect x="740" y="1170" width="460" height="115" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/><path d="M752,1170 V1285 M1188,1170 V1285" stroke="#b3afb9" fill="none"/><text x="970.0" y="1206.6000000000001" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#ececef"><tspan x="970.0" dy="0">Найти позиции и величины ошибок</tspan><tspan x="970.0" dy="28.6">Исправить байты; получить n</tspan><tspan x="970.0" dy="28.6">Повторно проверить синдромы</tspan></text><polygon points="970.0,1355 1200,1407.5 970.0,1460 740,1407.5" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/><text x="970.0" y="1415.2" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#ececef"><tspan x="970.0" dy="0">Восстановление успешно?</tspan></text><rect x="740" y="1530" width="460" height="110" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/><text x="970.0" y="1564.1000000000001" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#ececef"><tspan x="970.0" dy="0">Добавить в R только данные слова</tspan><tspan x="970.0" dy="28.6">Проверочные байты не выдавать</tspan><tspan x="970.0" dy="28.6">C = C + n</tspan></text><polygon points="764,1715 1200,1715 1176,1800 740,1800" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/><text x="970.0" y="1750.9" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#ececef"><tspan x="970.0" dy="0">Выход: данные R и число C</tspan><tspan x="970.0" dy="28.6">исправленных байтов</tspan></text><rect x="850" y="1850" width="240" height="40" rx="20.0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/><text x="970.0" y="1877.7" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#ececef"><tspan x="970.0" dy="0">Конец</tspan></text><rect x="1280" y="505" width="100" height="80" rx="24" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/><text x="1330.0" y="550.6" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#ececef"><tspan x="1330.0" dy="0">Ошибка</tspan></text><rect x="1280" y="1370" width="100" height="80" rx="24" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/><text x="1330.0" y="1415.6" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#ececef"><tspan x="1330.0" dy="0">Ошибка</tspan></text><path d="M310.0,150 L310.0,200" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M310.0,275 L310.0,335" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M310.0,420 L310.0,480" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M310.0,545 L310.0,615" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M310.0,720 L310.0,790" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M310.0,875 L310.0,945" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M310.0,1055 L310.0,1125" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M310.0,1240 L310.0,1310" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M310.0,1395 L310.0,1465" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M310.0,1520 L310,1580 L610,1580 L610,575 L310,575 L310.0,615" fill="none" strok