<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1170" viewBox="0 0 1280 1170"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#b3afb9"/></marker></defs><rect width="100%" height="100%" fill="#1f1e24"/><rect x="80" y="100" width="460" height="160" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/><text x="310.0" y="159.1" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#ececef"><tspan x="310.0" dy="0">Подготовить 256 ячеек</tspan><tspan x="310.0" dy="28.6">Для каждого индекса i от 0 до 255</tspan><tspan x="310.0" dy="28.6">начать с c = i.</tspan></text><rect x="80" y="310" width="460" height="160" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/><text x="310.0" y="369.09999999999997" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#ececef"><tspan x="310.0" dy="0">Обработать младший бит</tspan><tspan x="310.0" dy="28.6">Если c AND 1 = 0: c = c &gt;&gt; 1.</tspan><tspan x="310.0" dy="28.6">Иначе: c = (c &gt;&gt; 1) XOR 0xEDB88320.</tspan></text><rect x="80" y="520" width="460" height="160" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/><text x="310.0" y="579.1" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#ececef"><tspan x="310.0" dy="0">Выполнить восемь шагов</tspan><tspan x="310.0" dy="28.6">Повторить обработку бита 8 раз</tspan><tspan x="310.0" dy="28.6">для текущего индекса i.</tspan></text><rect x="80" y="730" width="460" height="160" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/><text x="310.0" y="789.1" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#ececef"><tspan x="310.0" dy="0">Сохранить элемент</tspan><tspan x="310.0" dy="28.6">TABLE[i] = c.</tspan><tspan x="310.0" dy="28.6">Перейти к следующему индексу.</tspan></text><rect x="80" y="940" width="460" height="160" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/><text x="310.0" y="999.1" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#ececef"><tspan x="310.0" dy="0">Получить готовую таблицу</tspan><tspan x="310.0" dy="28.6">256 значений для отражённого полинома.</tspan><tspan x="310.0" dy="28.6">Таблица общая для всех расчётов.</tspan></text><rect x="740" y="100" width="460" height="160" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/><text x="970.0" y="173.39999999999998" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#ececef"><tspan x="970.0" dy="0">Начальный регистр</tspan><tspan x="970.0" dy="28.6">crc = 0xFFFFFFFF.</tspan></text><rect x="740" y="310" width="460" height="160" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/><text x="970.0" y="369.09999999999997" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#ececef"><tspan x="970.0" dy="0">Взять очередной байт b</tspan><tspan x="970.0" dy="28.6">Обрабатывать байты в исходном порядке.</tspan><tspan x="970.0" dy="28.6">index = (crc AND 255) XOR b.</tspan></text><rect x="740" y="520" width="460" height="160" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/><text x="970.0" y="593.4000000000001" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#ececef"><tspan x="970.0" dy="0">Обновить регистр</tspan><tspan x="970.0" dy="28.6">crc = (crc &gt;&gt; 8) XOR TABLE[index].</tspan></text><rect x="740" y="730" width="460" height="160" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/><text x="970.0" y="789.1" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#ececef"><tspan x="970.0" dy="0">Обработать весь вход</tspan><tspan x="970.0" dy="28.6">Повторить шаги 2–3 для каждого байта.</tspan><tspan x="970.0" dy="28.6">Таблица заменяет восемь битовых шагов.</tspan></text><rect x="740" y="940" width="460" height="160" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/><text x="970.0" y="999.1" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#ececef"><tspan x="970.0" dy="0">Завершить расчёт</tspan><tspan x="970.0" dy="28.6">CRC = NOT crc (инверсия 32 бит).</tspan><tspan x="970.0" dy="28.6">Для пустого входа результат равен 0.</tspan></text><path d="M310.0,260 L310.0,310" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M310.0,470 L310.0,520" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M310.0,680 L310.0,730" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M310.0,890 L310.0,940" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M970.0,260 L970.0,310" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M970.0,470 L970.0,520" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M970.0,680 L970.0,730" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M970.0,890 L970.0,940" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/></svg>