<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1170" viewBox="0 0 1280 1170"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#b3afb9"/></marker></defs><rect width="100%" height="100%" fill="#1f1e24"/><text x="305.0" y="55.1" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" fill="#ececef" font-weight="bold"><tspan x="305.0" dy="0">Кодирование</tspan></text><rect x="80" y="100" width="460" height="160" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/><text x="310.0" y="144.79999999999998" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#ececef"><tspan x="310.0" dy="0">Построить модель</tspan><tspan x="310.0" dy="28.6">Подсчитать и нормализовать частоты.</tspan><tspan x="310.0" dy="28.6">Найти начала интервалов c(s).</tspan><tspan x="310.0" dy="28.6">Начальное состояние x = L.</tspan></text><rect x="80" y="310" width="460" height="160" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/><text x="310.0" y="369.09999999999997" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#ececef"><tspan x="310.0" dy="0">Взять символ с конца</tspan><tspan x="310.0" dy="28.6">Обрабатывать вход справа налево.</tspan><tspan x="310.0" dy="28.6">Для символа взять f(s) и c(s).</tspan></text><rect x="80" y="520" width="460" height="160" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/><text x="310.0" y="579.1" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#ececef"><tspan x="310.0" dy="0">Перенормировать состояние</tspan><tspan x="310.0" dy="28.6">Пока x ≥ 524288 × f(s):</tspan><tspan x="310.0" dy="28.6">выдать x mod 256; x = floor(x / 256).</tspan></text><rect x="80" y="730" width="460" height="160" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/><text x="310.0" y="774.8000000000001" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#ececef"><tspan x="310.0" dy="0">Закодировать символ</tspan><tspan x="310.0" dy="28.6">x = floor(x / f(s)) × 4096</tspan><tspan x="310.0" dy="28.6">+ (x mod f(s)) + c(s)</tspan><tspan x="310.0" dy="28.6">Повторять шаги 2–4 для всего входа.</tspan></text><rect x="80" y="940" width="460" height="160" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/><text x="310.0" y="999.1" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#ececef"><tspan x="310.0" dy="0">Записать выходной поток</tspan><tspan x="310.0" dy="28.6">Длина, модель, конечное x (LE).</tspan><tspan x="310.0" dy="28.6">Выданные байты — в обратном порядке.</tspan></text><text x="965.0" y="55.1" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" fill="#ececef" font-weight="bold"><tspan x="965.0" dy="0">Декодирование</tspan></text><rect x="740" y="100" width="460" height="160" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/><text x="970.0" y="159.1" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#ececef"><tspan x="970.0" dy="0">Прочитать модель и состояние</tspan><tspan x="970.0" dy="28.6">Восстановить f(s), c(s) и состояние x.</tspan><tspan x="970.0" dy="28.6">Построить таблицу на 4096 ячеек.</tspan></text><rect x="740" y="310" width="460" height="160" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/><text x="970.0" y="354.8" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#ececef"><tspan x="970.0" dy="0">Найти и вывести символ</tspan><tspan x="970.0" dy="28.6">q = x mod 4096.</tspan><tspan x="970.0" dy="28.6">Выбрать s: c(s) ≤ q &lt; c(s) + f(s).</tspan><tspan x="970.0" dy="28.6">Добавить s к результату.</tspan></text><rect x="740" y="520" width="460" height="160" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/><text x="970.0" y="579.1" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#ececef"><tspan x="970.0" dy="0">Обратить переход</tspan><tspan x="970.0" dy="28.6">x = f(s) × floor(x / 4096)</tspan><tspan x="970.0" dy="28.6">+ q − c(s)</tspan></text><rect x="740" y="730" width="460" height="160" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/><text x="970.0" y="774.8000000000001" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#ececef"><tspan x="970.0" dy="0">Перенормировать состояние</tspan><tspan x="970.0" dy="28.6">Пока x &lt; L: прочитать байт b;</tspan><tspan x="970.0" dy="28.6">x = 256 × x + b.</tspan><tspan x="970.0" dy="28.6">Повторять шаги 2–4 до длины N.</tspan></text><rect x="740" y="940" width="460" height="160" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/><text x="970.0" y="984.8000000000001" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#ececef"><tspan x="970.0" dy="0">Завершить поток</tspan><tspan x="970.0" dy="28.6">Проверить x = L.</tspan><tspan x="970.0" dy="28.6">Все входные байты должны быть</tspan><tspan x="970.0" dy="28.6">прочитаны.</tspan></text><path d="M310.0,260 L310.0,310" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M310.0,470 L310.0,520" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M310.0,680 L310.0,730" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M310.0,890 L310.0,940" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M970.0,260 L970.0,310" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M970.0,470 L970.0,520" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M970.0,680 L970.0,730" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M970.0,890 L970.0,940" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/></svg>