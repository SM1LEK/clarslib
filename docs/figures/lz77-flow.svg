<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1170" viewBox="0 0 1280 1170"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#b3afb9"/></marker></defs><rect width="100%" height="100%" fill="#1f1e24"/><text x="305.0" y="55.1" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" fill="#ececef" font-weight="bold"><tspan x="305.0" dy="0">Кодирование</tspan></text><rect x="80" y="100" width="460" height="160" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/><text x="310.0" y="159.1" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#ececef"><tspan x="310.0" dy="0">Начало блока</tspan><tspan x="310.0" dy="28.6">Записать длину N как varint.</tspan><tspan x="310.0" dy="28.6">position = 0; новый словарь.</tspan></text><rect x="80" y="310" width="460" height="160" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/><text x="310.0" y="354.8" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#ececef"><tspan x="310.0" dy="0">Найти лучшую ссылку</tspan><tspan x="310.0" dy="28.6">Окно 4096; длина до 255.</tspan><tspan x="310.0" dy="28.6">Оставить один байт для литерала.</tspan><tspan x="310.0" dy="28.6">При равной длине — ближайшая ссылка.</tspan></text><rect x="80" y="520" width="460" height="160" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/><text x="310.0" y="579.1" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#ececef"><tspan x="310.0" dy="0">Записать тройку</tspan><tspan x="310.0" dy="28.6">Длина, расстояние, следующий байт.</tspan><tspan x="310.0" dy="28.6">При длине 0 расстояние не пишется.</tspan></text><rect x="80" y="730" width="460" height="160" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/><text x="310.0" y="789.1" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#ececef"><tspan x="310.0" dy="0">Обновить словарь</tspan><tspan x="310.0" dy="28.6">Добавить все пройденные позиции.</tspan><tspan x="310.0" dy="28.6">position += длина + 1.</tspan></text><rect x="80" y="940" width="460" height="160" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/><text x="310.0" y="999.1" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#ececef"><tspan x="310.0" dy="0">Перейти к следующей тройке</tspan><tspan x="310.0" dy="28.6">Пока position &lt; N: повторить шаги 2–4.</tspan><tspan x="310.0" dy="28.6">Иначе вернуть поток LZ77.</tspan></text><text x="965.0" y="55.1" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" fill="#ececef" font-weight="bold"><tspan x="965.0" dy="0">Декодирование</tspan></text><rect x="740" y="100" width="460" height="160" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/><text x="970.0" y="144.79999999999998" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#ececef"><tspan x="970.0" dy="0">Прочитать поток</tspan><tspan x="970.0" dy="28.6">Прочитать N один раз; затем тройку.</tspan><tspan x="970.0" dy="28.6">При ненулевой длине — расстояние.</tspan><tspan x="970.0" dy="28.6">Прочитать следующий явный байт.</tspan></text><rect x="740" y="310" width="460" height="160" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/><text x="970.0" y="354.8" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#ececef"><tspan x="970.0" dy="0">Проверить ссылку</tspan><tspan x="970.0" dy="28.6">Расстояние не больше окна и выхода.</tspan><tspan x="970.0" dy="28.6">Ненулевая ссылка: расстояние &gt; 0.</tspan><tspan x="970.0" dy="28.6">Длина + литерал не выходят за N.</tspan></text><rect x="740" y="520" width="460" height="160" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/><text x="970.0" y="564.8000000000001" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#ececef"><tspan x="970.0" dy="0">Восстановить совпадение</tspan><tspan x="970.0" dy="28.6">Копировать по одному байту назад</tspan><tspan x="970.0" dy="28.6">на заданное расстояние.</tspan><tspan x="970.0" dy="28.6">Перекрытие ссылки допустимо.</tspan></text><rect x="740" y="730" width="460" height="160" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/><text x="970.0" y="789.1" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#ececef"><tspan x="970.0" dy="0">Добавить литерал</tspan><tspan x="970.0" dy="28.6">Записать следующий явный байт.</tspan><tspan x="970.0" dy="28.6">До конца потока повторять шаги 1–4.</tspan></text><rect x="740" y="940" width="460" height="160" rx="0" fill="#1f1e24" stroke="#b3afb9" stroke-width="1.5"/><text x="970.0" y="999.1" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#ececef"><tspan x="970.0" dy="0">Завершить блок</tspan><tspan x="970.0" dy="28.6">Проверить: восстановлено ровно N байт.</tspan><tspan x="970.0" dy="28.6">Вернуть исходный блок.</tspan></text><path d="M310.0,260 L310.0,310" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M310.0,470 L310.0,520" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M310.0,680 L310.0,730" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M310.0,890 L310.0,940" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M970.0,260 L970.0,310" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M970.0,470 L970.0,520" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M970.0,680 L970.0,730" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M970.0,890 L970.0,940" fill="none" stroke="#b3afb9" stroke-width="1.5" marker-end="url(#arrow)"/></svg>