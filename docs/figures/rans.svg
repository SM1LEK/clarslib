<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="565" viewBox="0 0 1120 565"><title>rANS: частоты и состояние для ABAB</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8" fill="#b3afb9"/></marker></defs><rect width="1120" height="565" fill="#1f1e24"/><g fill="#ececef" font-family="Arial, sans-serif" font-size="20"><text x="40" y="42">rANS: частоты и состояние для ABAB</text><text x="40" y="93">Общая сумма частот 4096. Два равных интервала по 2048 значений.</text><rect x="40" y="124" width="480" height="56" fill="none" stroke="#b3afb9"/><rect x="520" y="124" width="480" height="56" fill="none" stroke="#b3afb9"/><text x="185" y="161">A: 0…2047</text><text x="675" y="161">B: 2048…4095</text><text x="40" y="217">Остаток x mod 4096 выбирает символ по интервалу.</text><text x="40" y="267">Кодирование B → A → B → A</text><text x="590" y="267">Декодирование A → B → A → B</text><text x="40" y="310">8388608 → 16779264</text><text x="590" y="310">134238208 → 67119104</text><text x="40" y="346">16779264 → 33558528</text><text x="590" y="346">67119104 → 33558528</text><text x="40" y="382">33558528 → 67119104</text><text x="590" y="382">33558528 → 16779264</text><text x="40" y="418">67119104 → 134238208</text><text x="590" y="418">16779264 → 8388608</text><text x="40" y="476">Кодирование: x = floor(x / f) × 4096 + (x mod f) + c.</text><text x="40" y="512">Декодирование: x = f × floor(x / 4096) + (x mod 4096) − c.</text><text x="40" y="548">f — частота выбранного символа; c — начало его интервала.</text></g></svg>